<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>공고 · 입찰나침반</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="mx-auto min-h-screen max-w-[480px] bg-slate-50 md:border-x md:border-slate-200 md:shadow-md">
    <div id="header"></div>

    <!-- 검색 + 필터 -->
    <div class="sticky top-14 z-20 border-b border-slate-200 bg-white">
      <div class="px-4 pt-3">
        <label class="relative block">
          <span class="sr-only">공고 검색</span>
          <i data-lucide="search" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400"></i>
          <input id="q" type="search" placeholder="공고명, 기관명 검색"
            class="w-full rounded-btn border border-slate-200 bg-slate-50 py-2.5 pl-11 pr-3 text-[15px] placeholder:text-slate-400 focus:border-primary focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-100">
        </label>
      </div>
      <div id="filters" class="space-y-2 py-3"></div>
    </div>

    <main class="px-4 pb-24 pt-3">
      <div class="mb-3 flex items-center justify-between">
        <p class="text-sm text-slate-500">총 <b id="count" class="text-slate-800">0</b>건</p>
        <label class="relative flex items-center">
          <span class="sr-only">정렬</span>
          <select id="sort" class="appearance-none rounded-btn border border-slate-200 bg-white py-1.5 pl-3 pr-8 text-sm font-semibold text-slate-700 focus:border-primary focus:outline-none">
            <option value="match">매칭율순</option>
            <option value="deadline">마감임박순</option>
            <option value="latest">최신순</option>
            <option value="price">금액순</option>
          </select>
          <i data-lucide="chevron-down" class="pointer-events-none absolute right-2 h-4 w-4 text-slate-500"></i>
        </label>
      </div>
      <div id="list" class="space-y-3"></div>
      <div id="empty" class="hidden rounded-card border border-dashed border-slate-300 bg-white px-4 py-12 text-center">
        <i data-lucide="search-x" class="mx-auto h-8 w-8 text-slate-300"></i>
        <p class="mt-2 text-sm font-semibold text-slate-600">조건에 맞는 공고가 없습니다</p>
        <button type="button" id="reset" class="mt-3 text-sm font-bold text-primary hover:underline">필터 초기화</button>
      </div>
    </main>
  </div>
  <div id="bottom-nav"></div>

  <script src="assets/common.js"></script>
  <script>
    renderHeader();
    renderNav('bids');

    const GROUPS = [
      { key: 'type', label: '사업유형', options: ['전체', '물품', '용역', '공사'] },
      { key: 'region', label: '지역', options: ['전체', '서울', '경기', '인천', '대전', '세종', '전남'] },
      { key: 'status', label: '마감상태', options: ['전체', '진행중', '마감임박'] },
    ];
    const state = { type: '전체', region: '전체', status: '전체', q: '', sort: 'match' };

    if (qs('status') === 'imminent') state.status = '마감임박';
    if (['match', 'deadline', 'latest', 'price'].includes(qs('sort'))) state.sort = qs('sort');
    document.getElementById('sort').value = state.sort;

    function drawFilters() {
      document.getElementById('filters').innerHTML = GROUPS.map((g) => `
        <div class="no-scrollbar flex items-center gap-1.5 overflow-x-auto px-4" role="group" aria-label="${g.label}">
          <span class="w-14 shrink-0 text-xs font-semibold text-slate-400">${g.label}</span>
          ${g.options.map((o) => {
            const on = state[g.key] === o;
            return `<button type="button" data-g="${g.key}" data-v="${o}" aria-pressed="${on}"
              class="shrink-0 rounded-full border px-3 py-1 text-[13px] font-semibold transition ${chipClass(on)}">${o}</button>`;
          }).join('')}
        </div>`).join('');
    }

    const SORTERS = {
      match: (a, b) => b.match - a.match,
      deadline: (a, b) => a.d - b.d,
      latest: (a, b) => a.posted - b.posted || b.id - a.id,
      price: (a, b) => b.price - a.price,
    };

    function drawList() {
      const q = state.q.trim().toLowerCase();
      const rows = BIDS.filter((b) =>
        (state.type === '전체' || b.type === state.type) &&
        (state.region === '전체' || b.region === state.region) &&
        (state.status === '전체' || (state.status === '마감임박' ? b.d <= 3 : b.d > 3)) &&
        (!q || b.title.toLowerCase().includes(q) || b.org.toLowerCase().includes(q))
      ).sort(SORTERS[state.sort]);

      document.getElementById('list').innerHTML = rows.map(bidCard).join('');
      document.getElementById('count').textContent = rows.length;
      document.getElementById('empty').classList.toggle('hidden', rows.length > 0);
      icons();
    }

    document.getElementById('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-g]');
      if (!btn) return;
      state[btn.dataset.g] = btn.dataset.v;
      drawFilters();
      drawList();
    });
    document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; drawList(); });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; drawList(); });
    document.getElementById('reset').addEventListener('click', () => {
      Object.assign(state, { type: '전체', region: '전체', status: '전체', q: '' });
      document.getElementById('q').value = '';
      drawFilters();
      drawList();
    });

    drawFilters();
    drawList();
  </script>
</body>
</html>
