<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>홈 · 입찰나침반</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="mx-auto min-h-screen max-w-[480px] bg-slate-50 md:border-x md:border-slate-200 md:shadow-md">
    <div id="header"></div>

    <main class="pb-24">
      <!-- 인사말 -->
      <section class="px-4 pb-4 pt-5">
        <p class="text-sm text-slate-500" id="today"></p>
        <h1 class="mt-1 text-xl font-bold leading-snug">
          <span class="text-primary">(주)테스트전자</span>님,<br>오늘의 입찰 현황입니다
        </h1>
      </section>

      <!-- 요약 카드 (가로 스크롤) -->
      <section aria-label="요약" class="no-scrollbar flex snap-x gap-3 overflow-x-auto px-4 pb-2">
        <a href="bid-list.html?sort=latest" class="w-[150px] shrink-0 snap-start rounded-card border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-500"><i data-lucide="file-plus-2" class="h-4 w-4 text-primary"></i>오늘 신규 공고</div>
          <p class="mt-2 text-2xl font-extrabold">47<span class="ml-0.5 text-sm font-semibold text-slate-500">건</span></p>
          <p class="mt-1 text-xs font-semibold text-green-600">전일 대비 +12</p>
        </a>
        <a href="bid-list.html?status=imminent" class="w-[150px] shrink-0 snap-start rounded-card border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-slate-500"><i data-lucide="alarm-clock" class="h-4 w-4 text-red-500"></i>마감 임박</div>
          <p class="mt-2 text-2xl font-extrabold text-red-500">15<span class="ml-0.5 text-sm font-semibold text-slate-500">건</span></p>
          <p class="mt-1 text-xs text-slate-500">3일 이내 마감</p>
        </a>
        <a href="recommend.html" class="w-[150px] shrink-0 snap-start rounded-card border border-amber-200 bg-amber-50 p-4 shadow-sm hover:shadow-md">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-amber-700"><i data-lucide="target" class="h-4 w-4"></i>내 매칭 공고</div>
          <p class="mt-2 text-2xl font-extrabold text-amber-600">8<span class="ml-0.5 text-sm font-semibold text-amber-700/70">건</span></p>
          <p class="mt-1 text-xs text-amber-700">매칭율 70%↑</p>
        </a>
      </section>

      <!-- 추천 공고 TOP 5 -->
      <section class="mt-6 px-4">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-base font-bold">📌 맞춤 추천 공고 TOP 5</h2>
          <a href="recommend.html" class="flex items-center text-sm font-medium text-slate-500 hover:text-primary">전체보기<i data-lucide="chevron-right" class="h-4 w-4"></i></a>
        </div>
        <div id="top5" class="space-y-3"></div>
      </section>

      <!-- 빠른 도구 -->
      <section class="mt-8 px-4">
        <h2 class="mb-3 text-base font-bold">빠른 도구</h2>
        <div class="grid grid-cols-2 gap-3">
          <a href="calculator.html?tab=price" class="flex flex-col gap-3 rounded-card border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-50 text-primary"><i data-lucide="calculator" class="h-5 w-5"></i></span>
            <span class="text-sm font-bold">입찰금액 계산기</span>
          </a>
          <a href="calculator.html?tab=score" class="flex flex-col gap-3 rounded-card border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md">
            <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-amber-50 text-amber-600"><i data-lucide="clipboard-check" class="h-5 w-5"></i></span>
            <span class="text-sm font-bold">적격심사 점수 계산기</span>
          </a>
        </div>
      </section>
    </main>
  </div>
  <div id="bottom-nav"></div>

  <script src="assets/common.js"></script>
  <script>
    renderHeader();
    renderNav('home');

    const days = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('today').textContent = `${fmtDate(TODAY)} (${days[TODAY.getDay()]})`;

    // TOP 5 — 매칭율 순 상위 5건
    const top5 = [...BIDS].sort((a, b) => b.match - a.match).slice(0, 5);
    document.getElementById('top5').innerHTML = top5.map((b) => `
      <a href="bid-detail.html?id=${b.id}" class="flex gap-3 rounded-card border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md active:scale-[.99]">
        <div class="flex h-14 w-14 shrink-0 flex-col items-center justify-center rounded-xl bg-amber-100 text-amber-700">
          <span class="text-lg font-extrabold leading-none">${b.match}<span class="text-xs">%</span></span>
          <span class="mt-0.5 text-[10px] font-semibold">매칭</span>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">${typeTag(b.type)}</div>
          <h3 class="mt-1 truncate text-[15px] font-bold">${esc(b.title)}</h3>
          <p class="truncate text-sm text-slate-500">${esc(b.org)}</p>
          <div class="mt-2 flex items-center gap-2 text-sm">
            <span class="font-semibold text-slate-700">${fmtShort(b.price)}원</span>
            <span class="h-3 w-px bg-slate-200"></span>
            ${ddayBadge(b.d)}
          </div>
        </div>
      </a>`).join('');

    icons();
  </script>
</body>
</html>
