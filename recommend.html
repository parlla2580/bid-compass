<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>추천 · 입찰나침반</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-slate-100 text-slate-800">
  <div class="mx-auto min-h-screen max-w-[480px] bg-slate-50 md:border-x md:border-slate-200 md:shadow-md">
    <div id="header"></div>

    <main class="px-4 pb-24 pt-5">
      <section>
        <h1 class="text-xl font-bold">맞춤 추천 공고</h1>
        <p class="mt-1 text-sm text-slate-500">회원님의 업종·지역·실적 기반 매칭 결과입니다</p>
      </section>

      <!-- 매칭 기준 요약 (접이식) -->
      <details id="criteria" class="group mt-4 rounded-card border border-slate-200 bg-white shadow-sm">
        <summary class="flex cursor-pointer list-none items-center justify-between px-4 py-3.5 [&::-webkit-details-marker]:hidden">
          <span class="flex items-center gap-1.5 text-sm font-bold"><i data-lucide="sliders-horizontal" class="h-4 w-4 text-primary"></i>매칭 기준</span>
          <i data-lucide="chevron-down" class="h-5 w-5 text-slate-400 transition group-open:rotate-180"></i>
        </summary>
        <div class="border-t border-slate-100 px-4 pb-4 pt-3">
          <dl id="criteria-list" class="grid grid-cols-[104px_1fr] gap-y-2 text-sm"></dl>
          <a href="mypage.html?edit=matching" class="mt-3 inline-flex items-center gap-1 text-sm font-bold text-primary hover:underline">
            프로필 수정<i data-lucide="chevron-right" class="h-4 w-4"></i>
          </a>
        </div>
      </details>

      <!-- 매칭 사유 필터 -->
      <div class="mt-5 flex items-center justify-between">
        <p class="text-sm text-slate-500"><b id="count" class="text-slate-800">5</b>건 · 매칭율 높은 순</p>
        <button type="button" id="clear" class="hidden items-center gap-1 rounded-full bg-slate-800 py-1 pl-3 pr-2 text-xs font-semibold text-white">
          <span id="clear-label"></span><i data-lucide="x" class="h-3.5 w-3.5"></i>
        </button>
      </div>
      <div id="reason-chips" class="no-scrollbar -mx-4 mt-2 flex gap-1.5 overflow-x-auto px-4"></div>

      <div id="list" class="mt-3 space-y-3"></div>
    </main>
  </div>
  <div id="bottom-nav"></div>

  <script src="assets/common.js"></script>
  <script>
    renderHeader();
    renderNav('recommend');

    const p = getProfile();
    document.getElementById('criteria-list').innerHTML = [
      ['업종', p.industry.slice(0, 2).join(' > ')],
      ['지역', p.regions.join(', ') || '전체'],
      ['관심 사업유형', p.types.join(', ')],
      ['추정가격', `${fmtRange(p.priceMin)} ~ ${fmtRange(p.priceMax)}`],
    ].map(([k, v]) => `<dt class="text-slate-500">${k}</dt><dd class="font-medium">${esc(v)}</dd>`).join('');

    const REASONS = ['업종 일치', '지역 일치', '가격대 일치', '실적 충족'];
    const items = [...BIDS].sort((a, b) => b.match - a.match).slice(0, 5);
    let active = null;

    // 원형 프로그레스
    function ring(pct) {
      const r = 26, c = 2 * Math.PI * r;
      return `
        <div class="relative h-16 w-16 shrink-0">
          <svg viewBox="0 0 64 64" class="h-16 w-16 -rotate-90" aria-hidden="true">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="#FEF3C7" stroke-width="6"/>
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"
              stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/>
          </svg>
          <span class="absolute inset-0 flex items-center justify-center text-base font-extrabold text-amber-600">${pct}<span class="text-[10px]">%</span></span>
        </div>`;
    }

    function draw() {
      const rows = active ? items.filter((b) => b.reasons.includes(active)) : items;
      document.getElementById('count').textContent = rows.length;

      document.getElementById('reason-chips').innerHTML = REASONS.map((r) => {
        const on = active === r;
        return `<button type="button" data-reason="${r}" aria-pressed="${on}"
          class="shrink-0 rounded-full border px-3 py-1 text-[13px] font-semibold transition ${chipClass(on)}"># ${r}</button>`;
      }).join('');

      const clear = document.getElementById('clear');
      clear.classList.toggle('hidden', !active);
      clear.classList.toggle('inline-flex', !!active);
      document.getElementById('clear-label').textContent = active ? `필터: ${active}` : '';

      document.getElementById('list').innerHTML = rows.map((b) => `
        <article data-href="bid-detail.html?id=${b.id}" tabindex="0" role="link" aria-label="${esc(b.title)} 상세 보기"
          class="cursor-pointer rounded-card border border-slate-200 bg-white p-4 shadow-sm transition hover:shadow-md active:scale-[.99]">
          <div class="flex gap-3">
            ${ring(b.match)}
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">${typeTag(b.type)}${ddayBadge(b.d)}</div>
              <h3 class="mt-1 truncate text-[15px] font-bold">${esc(b.title)}</h3>
              <p class="truncate text-sm text-slate-500">${esc(b.org)} · <span class="font-semibold text-slate-700">${fmtShort(b.price)}원</span></p>
            </div>
          </div>
          <div class="mt-3 flex flex-wrap gap-1.5 border-t border-slate-100 pt-3">
            ${b.reasons.map((r) => `<button type="button" data-reason="${r}"
              class="rounded-md px-2 py-1 text-xs font-semibold transition ${active === r ? 'bg-primary text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}">${r}</button>`).join('')}
          </div>
        </article>`).join('');
      icons();
    }

    document.addEventListener('click', (e) => {
      const tag = e.target.closest('[data-reason]');
      if (tag) {
        e.stopPropagation();
        active = active === tag.dataset.reason ? null : tag.dataset.reason;
        draw();
        return;
      }
      const card = e.target.closest('[data-href]');
      if (card) location.href = card.dataset.href;
    });
    document.addEventListener('keydown', (e) => {
      const card = e.target.closest && e.target.closest('[data-href]');
      if (card && e.key === 'Enter' && e.target === card) location.href = card.dataset.href;
    });
    document.getElementById('clear').addEventListener('click', (e) => { e.stopPropagation(); active = null; draw(); });

    draw();
  </script>
</body>
</html>
