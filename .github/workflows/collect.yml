name: 나라장터 공고·계약 수집

on:
  schedule:
    # 매시 17분 (2026-11-15 운영계정 전환 후 3시간 → 1시간) — 구간 3시간으로 겹쳐 받아 누락 방지
    #  GitHub 예약 실행은 30~65분 늦게 시작하는 경우가 많음(실측) → 화면 반영까지 최대 약 2시간
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: '① 수집 구간(시간) — 평소 6 그대로 두세요. 날짜로 받을 때는 아래 ② 칸을 쓰세요'
        required: false
        default: '6'
      from:
        description: '② 거슬러 받기 시작일 — 예: 2026-10-27 (20261027도 됨). 넣으면 ① 대신 이 날부터 받음'
        required: false
        default: ''
      to:
        description: '③ 끝날 — 예: 2026-11-01 (그날 포함). 비우면 오늘까지'
        required: false
        default: ''
      mode:
        description: 'full = 평소 수집 / snapshot = 수집 없이 공고 목록 스냅샷만 다시 만들기(1분 안)'
        required: false
        default: 'full'
        type: choice
        options: [full, snapshot]
  push:
    branches: [main]
    paths:
      - 'scripts/collect.mjs'
      - '.github/workflows/collect.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 168시간 재수집은 20분을 넘김 (2026-11-08 20분 제한으로 중단됨)
    steps:
      - name: 비밀값 확인
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=""
          [ -z "$NARA_API_KEY" ] && missing="$missing NARA_API_KEY"
          [ -z "$SUPABASE_SECRET_KEY" ] && missing="$missing SUPABASE_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets에 다음 값이 없습니다:$missing"
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) echo "비밀값 2개 확인됨" ;;
            *) echo "::error::SUPABASE_SECRET_KEY는 sb_secret_ 로 시작해야 합니다 (publishable 키가 들어갔는지 확인)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 수집 실행
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://tpuhqzxhrwuugojsnfpj.supabase.co
          COLLECT_HOURS: ${{ github.event.inputs.hours || '3' }}
          COLLECT_MODE: ${{ github.event.inputs.mode || 'full' }}
          COLLECT_FROM: ${{ github.event.inputs.from || '' }}
          COLLECT_TO: ${{ github.event.inputs.to || '' }}
        run: node scripts/collect.mjs

      - name: 문제가 있으면 알림 (GitHub 이슈)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: 매시간 수집
        run: node scripts/alert.mjs
